<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penumbra</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><section id="landing" class="panel"><div class="brand"><span>◆</span><h1>PENUMBRA</h1><p>O medo não precisa de olhos para encontrar você.</p></div><label>Seu codinome<input id="name" maxlength="18" placeholder="Sobrevivente"></label><button id="create" class="primary">Criar sala</button><div class="join"><input id="code" maxlength="5" placeholder="CÓDIGO"><button id="join">Entrar</button></div><p id="landing-error" class="error"></p><small>2–6 jogadores · rodada de 3 minutos</small></section>
<section id="room" hidden><header><div class="logo">◆ PENUMBRA</div><div class="room-code">SALA <b id="room-code">-----</b><button id="copy" title="Copiar código">⧉</button></div><button id="leave" class="ghost">Sair</button></header><div id="lobby" class="panel lobby"><p class="eyebrow">ABRIGO TEMPORÁRIO</p><h2>Aguardando as sombras</h2><p class="sub">Convide seus amigos com o código da sala.</p><div id="players" class="players"></div><button id="start" class="primary">Iniciar rodada</button><p id="authority-note" class="hint"></p></div><div id="game" hidden><canvas id="canvas"></canvas><div id="hud"><div><small>TEMPO RESTANTE</small><strong id="timer">03:00</strong></div><div id="status"></div><div><small>VIVOS</small><strong id="alive">0</strong></div></div><div id="notice"></div><div id="end-card" hidden class="panel"><p class="eyebrow">A RODADA TERMINOU</p><h2 id="winner"></h2><button id="back" class="primary">Voltar ao abrigo</button></div></div></section></main><script src="config.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script><script src="game.js"></script></body></html>
